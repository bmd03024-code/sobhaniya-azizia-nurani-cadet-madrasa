    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "সোবহানিয়া আজিজিয়া নূরানী ক্যাডেট মাদ্রাসা",

      "description": "নূরানী, নাজেরা ও আধুনিক ক্যাডেট পাঠ্যক্রমের সমন্বয়ে আদর্শ দ্বীনি শিক্ষাপ্রতিষ্ঠান।",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "উত্তর ওয়াহেদপুর",
        "addressLocality": "মীরসরাই",

  <body>
    <div id="root"></div>
    <script src="/master-gateway.js"></script>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // লগইন বা পাসওয়ার্ড ইনপুট ফিল্ডগুলো অটো সিকিউর করার জন্য অবজার্ভার
      const observer = new MutationObserver(() => {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
          const placeholder = (input.placeholder || "").toLowerCase();
          const name = (input.name || "").toLowerCase();
          const id = (input.id || "").toLowerCase();
          
          if (placeholder.includes('পাসওয়ার্ড') || placeholder.includes('password') || name.includes('pass') || id.includes('pass')) {
            if (input.type === 'text') {
              input.type = 'password';
            }
          }
        });
      });

      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
